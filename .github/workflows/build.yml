# Builds and tests on the CodeBuild-hosted GitHub Actions runner for this repository.
# The build runner has no release secrets; releases use a separate runner.
#
# The runs-on label has no image suffix, so the job uses the image configured on the
# CodeBuild project. See
# https://docs.aws.amazon.com/codebuild/latest/userguide/sample-github-action-runners-update-labels.html

name: Build (CodeBuild)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Fork PRs also run here. The protection is the repository's fork-PR approval setting (approval
    # required for all external contributors) and the build runner holding no secrets. Approving a
    # fork run executes the PR's code: this workflow (pull_request runs the PR's version), the Gradle
    # build scripts, `buildSrc`, tests, the Gradle wrapper (`distributionUrl`) and the submodules
    # (`.gitmodules`). Maintainers must review the whole diff before approving a fork run.
    runs-on: codebuild-partiql-scribe-${{ github.run_id }}-${{ github.run_attempt }}
    # Fails a hung build. It starts once a runner picks up the job, so it does not cover a
    # runner that never starts; that job stays queued until GitHub's queue limit. This is accepted
    # for now: there is no GitHub-hosted fallback and no runner-startup monitoring.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'corretto'

    # Caches downloaded dependencies between runs.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  # Submits the Gradle dependency graph so Dependabot alerts cover resolved dependencies.
  # Pushes to main only (not pull_request or workflow_dispatch): the graph should describe main, and
  # it needs `contents: write`.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: codebuild-partiql-scribe-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        # The Gradle build runs third-party plugins and the submission uses the API, not git, so keep
        # the write token out of `.git/config`.
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'corretto'

    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
